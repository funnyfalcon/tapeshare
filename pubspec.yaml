name: tapeshare
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  shared_preferences: ^2.2.3
  record: ^6.2.0
  just_audio: ^0.10.5
  path_provider: ^2.1.2
  permission_handler: ^12.0.1
  share_plus: ^12.0.1
  uuid: ^4.3.3
  supabase_flutter: ^2.3.4
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
